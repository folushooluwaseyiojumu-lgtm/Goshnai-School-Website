<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students - Goshnai Montessori Academy</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <img src="images/school-logo.png"
         alt="School Logo"
         class="school-logo">

    <h1>Goshnai Montessori Academy</h1>

    <p>Student Management</p>

</header>


<nav>

    <div class="menu">

        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="admission.html">Admission</a>
        <a href="fees.html">School Fees</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>

    </div>

</nav>


<main>

<section class="students-section">

    <h2>Student Management</h2>

    <p>
        Manage existing pupils, newly admitted students
        and school-fee payment status.
    </p>

<div class="student-actions">

    <button type="button" onclick="addStudent()">
        Add Existing Student
    </button>

    <button type="button" onclick="showAllStudents()">
        View All Students
    </button>

    <button type="button" onclick="showPaidStudents()">
        View Paid Students
    </button>

    <button type="button" onclick="showUnpaidStudents()">
        View Unpaid Students
    </button>
<button type="button" onclick="showPartPaidStudents()">
    View Part Paid Students
</button>
</div>
<div class="session-control">

    <label for="academicSession">
        Academic Session:
    </label>

    <select id="academicSession" onchange="changeAcademicSession()">

    <option value="">All Sessions</option>

    <option value="2026/2027">2026/2027</option>
    <option value="2027/2028">2027/2028</option>
    <option value="2028/2029">2028/2029</option>
    <option value="2029/2030">2029/2030</option>

</select>

</div>
<div class="student-search">

    <input
        type="text"
        id="studentSearch"
        placeholder="Search by name, admission number or class"
        oninput="searchStudents()"
    >

</div>
<div class="class-filter">

    <label for="classFilter">
        Filter by Class:
    </label>

    <select id="classFilter" onchange="filterByClass()">

        <option value="">All Classes</option>

        <option>Nursery 1</option>
        <option>Nursery 2</option>

        <option>Primary 1</option>
        <option>Primary 2</option>
        <option>Primary 3</option>
        <option>Primary 4</option>
        <option>Primary 5</option>
        <option>Primary 6</option>

        <option>JSS 1</option>
        <option>JSS 2</option>
        <option>JSS 3</option>

        <option>SS 1</option>
        <option>SS 2</option>
        <option>SS 3</option>

    </select>

</div>

<div id="studentProfile" class="q-profile"></div>

<div id="studentsList">

    <p>No students registered yet.</p>

</div>

    </div>

</section>

</main>


<footer class="footer">

    <div class="footer-bottom">

        <p>
            © 2026 Goshnai Montessori Academy
        </p>

        <p>
            In Excellence Pursuit, We Believe
        </p>

    </div>

</footer>
<script src="students.js"></script>
</body>

  </html>
