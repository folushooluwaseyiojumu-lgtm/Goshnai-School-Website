<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0b4a8b;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-container{
    background:white;
    width:90%;
    max-width:450px;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

.login-container h2{
    text-align:center;
    color:#0b4a8b;
    font-size:32px;
    margin-bottom:25px;
}

.login-container input{
    width:100%;
    padding:15px;
    margin:12px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:18px;
    box-sizing:border-box;
}

.login-container button{
    width:100%;
    padding:15px;
    margin-top:10px;
    background:#0b4a8b;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.login-container button:hover{
    background:#08396b;
}
</style>
</head>

<body>

<div class="login-container">

    <h2>Admin Login</h2>

    <input
    type="text"
    id="username"
    placeholder="Username">

<input
    type="password"
    id="password"
    placeholder="Password">

<button onclick="loginAdmin()">
    Login
</button>



</div>
<script src="admin-login.js"></script>
</body>
</html>
